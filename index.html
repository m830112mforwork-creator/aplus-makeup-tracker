<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國小英語 補課派工與進度追蹤系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20263B;
    --ink-soft:#565D77;
    --paper:#FAF8F3;
    --panel:#FFFFFF;
    --line:#E4DFD3;
    --primary:#3D3466;
    --primary-soft:#EFEBF7;
    --gold:#B8902E;
    --gold-soft:#FBF3DF;
    --ok:#3F7A5C;
    --ok-soft:#E7F3EC;
    --warn:#B4472E;
    --warn-soft:#FBEAE5;
    --radius:10px;
    font-family:"Noto Sans TC","Inter",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
  }
  h1,h2,h3{
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:.01em;
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  input,select,textarea,button{
    font-family:inherit;
    font-size:14px;
  }
  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--primary);
    color:#fff;
    padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
  }
  header .brand{display:flex; flex-direction:column;}
  header .brand .title{font-size:17px; font-weight:700;}
  header .brand .sub{font-size:12px; opacity:.75; margin-top:2px;}
  header .identity{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  header select, header input{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    color:#fff;
    padding:7px 10px;
    border-radius:8px;
  }
  header select option{color:#20263B;}
  header input::placeholder{color:rgba(255,255,255,.7);}
  .role-tabs{display:flex; gap:4px; background:rgba(255,255,255,.12); border-radius:9px; padding:3px;}
  .role-tabs button{
    border:none; background:transparent; color:rgba(255,255,255,.75);
    padding:7px 14px; border-radius:7px; font-weight:600; font-size:13px;
  }
  .role-tabs button.active{background:#fff; color:var(--primary);}

  main{max-width:1180px; margin:0 auto; padding:24px 20px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
  }
  .panel > h2{font-size:16px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--line);}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
    background:#fff; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field.wide{grid-column:1/-1;}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--primary); background:var(--primary); color:#fff;
    padding:9px 16px; border-radius:8px; font-weight:600; font-size:13.5px;
  }
  .btn.secondary{background:#fff; color:var(--primary);}
  .btn.ghost{background:transparent; border-color:var(--line); color:var(--ink-soft);}
  .btn.small{padding:6px 11px; font-size:12.5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.warn{background:var(--warn); border-color:var(--warn);}

  /* slot grid */
  .slot-table{width:100%; border-collapse:collapse; font-size:13px;}
  .slot-table th, .slot-table td{border:1px solid var(--line); padding:6px; text-align:center;}
  .slot-table th{background:var(--primary-soft); color:var(--primary); font-weight:700;}
  .slot-cell{
    width:100%; border:1px solid var(--line); background:#fff; border-radius:6px;
    padding:8px 4px; font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .slot-cell.full{color:#B0A9A0; background:#F4F1EA; text-decoration:line-through;}
  .slot-cell.unavailable{color:#B0A9A0; background:#F4F1EA;}
  .slot-cell.selected{background:var(--primary); color:#fff; border-color:var(--primary);}
  .slot-cell small{display:block; font-weight:400; opacity:.75; margin-top:2px;}

  /* record cards */
  .record-card{
    border:1px solid var(--line); border-radius:9px; padding:14px 16px; margin-bottom:10px; background:#fff;
  }
  .record-card.overdue{border-color:var(--warn); background:var(--warn-soft);}
  .record-card .rc-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .record-card .rc-title{font-weight:700; font-size:15px;}
  .record-card .rc-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .tag{display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .tag.pending{background:var(--gold-soft); color:var(--gold);}
  .tag.done{background:var(--ok-soft); color:var(--ok);}
  .tag.overdue{background:var(--warn-soft); color:var(--warn);}
  .rc-body{margin-top:10px; font-size:13.5px; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px 14px;}
  .rc-body .kv b{display:block; font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .rc-actions{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;}
  .ta-form{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none;}
  .ta-form.open{display:block;}

  /* dashboard */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{border:1px solid var(--line); border-radius:9px; padding:14px; background:#fff;}
  .stat .num{font-size:26px; font-weight:700; font-family:"Inter",sans-serif;}
  .stat .label{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .stat.overdue .num{color:var(--warn);}
  .stat.done .num{color:var(--ok);}

  table.admin-table{width:100%; border-collapse:collapse; font-size:12.8px;}
  table.admin-table th, table.admin-table td{border:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top;}
  table.admin-table th{background:var(--primary-soft); color:var(--primary); position:sticky; top:56px;}
  table.admin-table tr.overdue td{background:var(--warn-soft);}
  table.admin-table tr.done td{background:var(--ok-soft);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:9px;}

  .empty{color:var(--ink-soft); font-size:13.5px; padding:18px; text-align:center;}

  /* modal */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(32,38,59,.5); z-index:50;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:#fff; border-radius:12px; max-width:480px; width:100%; padding:22px;
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin-bottom:10px;}
  .modal textarea{
    width:100%; min-height:220px; border:1px solid var(--line); border-radius:8px; padding:12px;
    font-size:13.5px; line-height:1.7; white-space:pre-wrap;
  }
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:12px;}
  .status-radio{display:flex; gap:10px; margin:10px 0; font-size:13px;}
  .status-radio label{display:flex; align-items:center; gap:5px;}

  .banner{
    background:var(--gold-soft); border:1px solid #EAD9A6; color:#7A5D14;
    border-radius:9px; padding:10px 14px; font-size:12.8px; margin-bottom:16px;
  }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:60;
  }
  .toast.show{opacity:1;}
  @media (max-width:640px){
    table.admin-table th{position:static;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="title">國小英語 補課派工與進度追蹤系統</div>
    <div class="sub" id="connStatus">連線中…</div>
  </div>
  <div class="identity">
    <div class="role-tabs" id="roleTabs">
      <button data-role="teacher" class="active">老師</button>
      <button data-role="ta">助教/輔導老師</button>
      <button data-role="admin">主任</button>
    </div>
    <input id="myName" placeholder="輸入你的姓名" />
  </div>
</header>

<main>

  <div class="banner" id="setupBanner" style="display:none;"></div>

  <!-- ========== 老師 VIEW ========== -->
  <section class="view active" id="view-teacher">
    <div class="panel">
      <h2>新增請假補課紀錄</h2>
      <form id="teacherForm">
        <div class="grid">
          <div class="field"><label>學生中文名</label><input name="studentNameCh" required></div>
          <div class="field"><label>學生英文名</label><input name="studentNameEn"></div>
          <div class="field"><label>年級</label><input name="grade" placeholder="例如：三年級"></div>
          <div class="field"><label>英語班級</label><input name="className"></div>
          <div class="field"><label>英語導師</label><input name="homeroomTeacher"></div>
          <div class="field"><label>英語教室</label><input name="classroom"></div>
          <div class="field"><label>缺課日期</label><input type="date" name="absenceDate" required></div>
          <div class="field">
            <label>請假原因</label>
            <select name="leaveReason">
              <option>事假</option><option>病假</option><option>公假</option>
              <option>學校活動</option><option>其他</option>
            </select>
          </div>
          <div class="field">
            <label>缺課核心課程（VAA/OAA=書寫朗誦、GAA=文法、PAA=發音）</label>
            <select name="coreCourse">
              <option>VAA/OAA</option><option>GAA</option><option>PAA</option><option>其他</option>
            </select>
          </div>
          <div class="field"><label>課本及單元 (ch/unit/page)</label><input name="bookUnit"></div>
          <div class="field wide"><label>指派補課內容</label><textarea name="assignedContent" placeholder="例如：1. 帶讀單字句型　2. 補寫 Workbook P.18　3. 補考單字聽寫"></textarea></div>
          <div class="field">
            <label>預計補課時長</label>
            <select name="plannedDuration">
              <option>15 分鐘</option><option>20 分鐘</option><option>30 分鐘</option>
              <option>40 分鐘</option><option>60 分鐘</option>
            </select>
          </div>
        </div>

        <h3 style="margin-top:18px; font-size:14px;">選擇補課時段（顯示各時段剩餘名額，額滿無法選取）</h3>
        <div id="slotPicker"></div>
        <input type="hidden" name="slotWeekday">
        <input type="hidden" name="slotTime">
        <input type="hidden" name="slotTA">

        <div style="margin-top:16px;">
          <button type="submit" class="btn">送出紀錄</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>我登記的補課紀錄</h2>
      <div id="teacherRecordList"></div>
    </div>
  </section>

  <!-- ========== 助教 VIEW ========== -->
  <section class="view" id="view-ta">
    <div class="panel">
      <h2>待處理的補課（指派給我）</h2>
      <div id="taPendingList"></div>
    </div>
    <div class="panel">
      <h2>已完成紀錄</h2>
      <div id="taDoneList"></div>
    </div>
  </section>

  <!-- ========== 主任 VIEW ========== -->
  <section class="view" id="view-admin">
    <div class="stat-row" id="adminStats"></div>

    <div class="panel">
      <h2>全部補課紀錄</h2>
      <div class="table-wrap">
        <table class="admin-table" id="adminTable">
          <thead>
            <tr>
              <th>狀態</th><th>缺課日期</th><th>學生</th><th>班級/導師</th><th>原因</th>
              <th>指派內容</th><th>時段</th><th>助教</th><th>實際補課</th><th>驗收</th><th>家長已通知</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>助教/輔導老師 時段與名額設定</h2>
      <div id="rosterEditor"></div>
      <form id="rosterAddForm" class="grid" style="margin-top:14px;">
        <div class="field"><label>星期</label>
          <select name="weekday"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option></select>
        </div>
        <div class="field"><label>時段</label>
          <select name="time"><option>1:00-2:00</option><option>3:30-4:00</option><option>6:30-7:00</option></select>
        </div>
        <div class="field"><label>助教/輔導老師姓名</label><input name="ta" required></div>
        <div class="field"><label>名額</label><input name="quota" type="number" value="4" min="1"></div>
        <div class="field" style="align-self:end;"><button type="submit" class="btn small">新增/更新時段</button></div>
      </form>
    </div>
  </section>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">訊息</h3>
    <div id="modalExtra"></div>
    <textarea id="modalText" readonly></textarea>
    <div class="modal-actions">
      <button class="btn ghost small" id="modalClose">關閉</button>
      <button class="btn small" id="modalCopy">複製文字</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
